name: CI

on:
  push:
  pull_request:

jobs:
  integration:
    name: PowerShell integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated integration tests
        shell: pwsh
        run: ./tests/run.ps1
